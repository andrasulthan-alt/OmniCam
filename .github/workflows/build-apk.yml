name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Signed, optimized release build when the signing key secrets exist; debug build otherwise (e.g. forks).
      HAS_KEY: ${{ secrets.OMNICAM_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses (AGP downloads platform 37 automatically)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # gradle-wrapper.jar is not committed, so use Gradle directly
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.1

      - name: Build signed release APK
        if: env.HAS_KEY == 'true'
        env:
          OMNICAM_KEYSTORE_B64: ${{ secrets.OMNICAM_KEYSTORE_B64 }}
          OMNICAM_KEYSTORE_PASSWORD: ${{ secrets.OMNICAM_KEYSTORE_PASSWORD }}
          OMNICAM_KEY_ALIAS: ${{ secrets.OMNICAM_KEY_ALIAS }}
          OMNICAM_KEY_PASSWORD: ${{ secrets.OMNICAM_KEY_PASSWORD }}
        run: |
          echo "$OMNICAM_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/omnicam.jks"
          export OMNICAM_KEYSTORE_PATH="$RUNNER_TEMP/omnicam.jks"
          gradle assembleRelease --stacktrace
          rm -f "$RUNNER_TEMP/omnicam.jks"

      - name: Upload release APK
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: omnicam-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Build debug APK (no signing key configured)
        if: env.HAS_KEY != 'true'
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        if: env.HAS_KEY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: omnicam-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
